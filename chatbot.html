{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h1>AI Chatbot</h1><p>Ask general doubts or select teacher notes for notes-based answers.</p></div>
<section class="chat-shell glass">
  <div class="chat-tools">
    <label>Answer using selected teacher notes (optional)</label>
    <select id="noteSelect">
      <option value="0">General AI Assistant</option>
      {% for note in notes %}<option value="{{ note.id }}">{{ note.title }} — {{ note.subject }}</option>{% endfor %}
    </select>
    <div id="suggestions" class="suggestions">
      <button type="button" class="chip">Explain this topic in simple words</button>
      <button type="button" class="chip">Create quick revision points</button>
      <button type="button" class="chip">Generate 5 quiz questions</button>
    </div>
  </div>
  <div id="chatBox" class="chat-box">
    <div class="bot bubble">Hi {{ current_user.name }}! Ask me any learning question or select notes for notes-based answers.</div>
  </div>
  <form id="chatForm" class="chat-form">
    <input id="messageInput" placeholder="Ask a doubt..." required>
    <button class="btn" type="submit">Send</button>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>{% endblock %}
